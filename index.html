<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citation information</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="input-section">
            <input type="text" id="doiInput" placeholder="Enter DOI (e.g., 10.1000/xyz123 or doi:10.1000/xyz123)" />
            <button onclick="fetchBibTeX()">Convert</button>
        </div>
        <div id="result" class="result"></div>
        <div id="xmlOutput" class="xml-output"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
