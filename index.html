<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citation information</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-between form-input">
            <input type="text" class="form-control" id="doiInput" placeholder="Enter DOI (e.g., 10.1000/xyz123 or doi:10.1000/xyz123)" />
            <button class="btn btn-primary profile-button" id="fetchButton" onclick="fetchBibTeX()">Search</button>
        </div>
        <div id="result" class="result"></div>
        <div id="xmlOutput" class="xml-output"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
